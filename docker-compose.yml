version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employee_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: Test@123

    ports:
      - "3306:3306"

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: backend

    restart: always

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend
